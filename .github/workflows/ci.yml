name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Smoke lint: syntax errors and undefined names only, so existing
      # pragmatic code passes while real breakage blocks the merge.
      # Vendored third-party code (Wav2Lip_repo) is excluded.
      - name: Lint (ruff smoke rules)
        run: ruff check backend --exclude backend/Wav2Lip_repo --select E9,F63,F7,F82

      - name: Unit tests
        run: pytest backend/tests -q
